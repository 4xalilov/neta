[project]
name = "engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic-settings",
  "sqlalchemy[asyncio]>=2.0", "asyncpg", "alembic", "pgvector",
  "langgraph", "langgraph-checkpoint-postgres", "langchain-core",
  "anthropic", "google-genai",
  "arq", "redis", "boto3", "httpx",
  "azure-cognitiveservices-speech", "fal-client", "edge-tts",
  "bullmq>=2,<3", "psycopg[binary]", "pyyaml", "jsonschema",
  "python-multipart",
]
[project.optional-dependencies]
# Lokal STT (roadmap 5.10, WhisperSTT): og'ir (CTranslate2 + PyAV) — default deps'da emas.
stt-local = ["faster-whisper"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "aiosqlite", "moto[s3]", "fakeredis"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
asyncio_mode = "auto"
