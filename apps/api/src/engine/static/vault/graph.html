<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI Marketing Engine · Bilim grafi</title>
<meta name="description" content="Vault bilim grafi — jonli, WebSocket orqali yangilanadigan tugunlar va bog'lanishlar." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/vault/static/graph.css" />
</head>
<body>
<div class="bg-gradient" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">AI</span>
    <span class="brand-text">AI Marketing Engine <span class="brand-sep">·</span> Bilim grafi</span>
  </div>
  <div class="kpis" id="kpis">
    <div class="kpi">
      <div class="kpi-value" id="kpi-files">0</div>
      <div class="kpi-label">fayllar</div>
    </div>
    <div class="kpi">
      <div class="kpi-value" id="kpi-today">0</div>
      <div class="kpi-label">bugun yangilandi</div>
    </div>
    <div class="kpi">
      <div class="kpi-value" id="kpi-links">0</div>
      <div class="kpi-label">bog'lanishlar</div>
    </div>
  </div>
  <div class="topbar-actions">
    <span class="conn-dot" id="conn-dot" title="Ulanish holati"></span>
    <button class="demo-toggle" id="demo-toggle" type="button" aria-pressed="false">
      <span class="dot"></span> Demo rejimi
    </button>
  </div>
</header>

<main class="stage">
  <div id="graph" class="graph-canvas"></div>

  <aside class="panel" id="panel" aria-hidden="true">
    <button class="panel-close" id="panel-close" type="button" aria-label="Yopish">✕</button>
    <div class="panel-body">
      <div class="panel-type" id="panel-type">&nbsp;</div>
      <h2 class="panel-title" id="panel-title">—</h2>
      <div class="panel-tags" id="panel-tags"></div>
      <div class="panel-path" id="panel-path"></div>
      <div class="panel-markdown" id="panel-markdown">
        <p class="panel-hint">Tugunni bosing — matni shu yerda ko'rinadi.</p>
      </div>
    </div>
  </aside>
</main>

<footer class="ticker-wrap">
  <div class="ticker-label">Jonli faoliyat</div>
  <ul class="ticker" id="ticker" aria-live="polite"></ul>
</footer>

<script src="https://cdn.jsdelivr.net/npm/force-graph@1/dist/force-graph.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="/vault/static/graph.js"></script>
</body>
</html>
