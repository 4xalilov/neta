# Chatwoot self-host — MINIMAL skelet (bosqich 5.2, docs/07-open-source-foundations.md).
# Ishga tushirishdan oldin rasmiy compose bilan solishtirib TEKSHIRING:
# https://www.chatwoot.com/docs/self-hosted/deployment/docker
#
# docs/07: Chatwoot — barcha kanallar (IG DM/komment, Telegram, sayt chat) uchun bitta
# inbox, webhook orqali Jarvis'ga yuboradi. Kodning boshqa joyidan faqat
# apps/api/src/engine/integrations/chatwoot.py orqali murojaat qilinadi.
#
# CHATWOOT_VERSION .env faylida pin qilinadi; pastdagi qiymat TAXMIN — real relizlar
# bilan solishtiring: https://github.com/chatwoot/chatwoot/releases
#
# Bu compose "ame_default" tashqi tarmog'iga ulanadi (twenty/docker-compose.yml dagi
# izohga qarang — tarmoq oldindan `docker network create ame_default` bilan yaratiladi).

services:
  chatwoot-db:
    image: postgres:16
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwoot}
      POSTGRES_DB: chatwoot
    volumes:
      - chatwoot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [ame_default]

  chatwoot-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [ame_default]

  chatwoot-rails:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-v4.2.0}
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?CHATWOOT_SECRET_KEY_BASE .env da kerak — masalan `openssl rand -hex 64`}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3001}
      POSTGRES_HOST: chatwoot-db
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwoot}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://chatwoot-redis:6379
      ENABLE_ACCOUNT_SIGNUP: "false"
    volumes:
      - chatwoot-storage:/app/storage
    ports: ["3001:3000"]
    restart: unless-stopped
    networks: [ame_default]

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-v4.2.0}
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?CHATWOOT_SECRET_KEY_BASE .env da kerak}
      POSTGRES_HOST: chatwoot-db
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:-chatwoot}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://chatwoot-redis:6379
    volumes:
      - chatwoot-storage:/app/storage
    restart: unless-stopped
    networks: [ame_default]

volumes:
  chatwoot-db-data:
  chatwoot-storage:

networks:
  ame_default:
    external: true
