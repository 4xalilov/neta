services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ame
      POSTGRES_PASSWORD: ame
      POSTGRES_DB: ame
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ame
      MINIO_ROOT_PASSWORD: ame12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  api:
    build: ./apps/api
    env_file: .env
    depends_on: [postgres, redis, minio]
    ports: ["8000:8000"]
    volumes: ["./apps/api:/app"]
    command: uvicorn engine.main:app --host 0.0.0.0 --port 8000 --reload
  worker:
    build: ./apps/api
    env_file: .env
    depends_on: [postgres, redis, minio]
    volumes: ["./apps/api:/app"]
    command: arq engine.worker.WorkerSettings
  bot:
    build: ./apps/bot
    env_file: .env
    depends_on: [api]
  render:
    build: ./apps/render
    env_file: .env
    depends_on: [redis, minio]
    volumes: ["./apps/render:/app", "/app/node_modules"]
volumes:
  pgdata:
  miniodata:
